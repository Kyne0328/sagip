name: Field Test Release

on:
  push:
    tags:
      - 'field-test-*'

permissions:
  contents: read

concurrency:
  group: sagip-field-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-field-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SAGIP_BACKEND_BASE_URL: https://br-shy-brook-b3mhu6ho-api.compute.c-4.ap-southeast-1.aws.neon.tech

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;27.0.12077973"

      - name: Verify hosted field-test backend health
        run: node scripts/verify-backend.mjs "$SAGIP_BACKEND_BASE_URL" --health-only

      - name: Install app dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Start isolated PostgreSQL test database
        run: bash scripts/start-test-postgres.sh

      - name: Validate JavaScript and backend
        shell: bash
        run: |
          npm test -- --runInBand
          npx tsc --noEmit
          npm run lint
          npm --prefix backend test
          npm --prefix backend run typecheck
          npm --prefix backend run lint

      - name: Stop isolated PostgreSQL test database
        if: ${{ always() }}
        run: docker rm --force sagip-test-postgres || true

      - name: Build Android field-test APK
        shell: bash
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android testDebugUnitTest assembleDebug \
            -PSAGIP_BACKEND_BASE_URL="$SAGIP_BACKEND_BASE_URL"

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/sagip-$GITHUB_REF_NAME.apk"
          sha256sum "dist/sagip-$GITHUB_REF_NAME.apk" > "dist/sagip-$GITHUB_REF_NAME.apk.sha256"
          cat > dist/release-notes.md <<'EOF'
          ## SAGIP field-test build

          This is a **pre-release for controlled physical-device testing**, not a production emergency-service release.

          The APK is a debug-signed field-test build configured for the hosted SAGIP Neon HTTPS backend in Singapore.
          No database password, Neon API key, or responder bearer credential is embedded in the APK.

          Automated in this workflow:
          - hosted backend `/healthz` check
          - root Jest, TypeScript, and ESLint checks
          - backend tests, TypeScript, and ESLint
          - Android unit tests and debug APK build
          - SHA-256 checksum generation

          This workflow does not re-run physical-device, live-database concurrency, or end-to-end field acceptance. Those results must be tracked separately and must not be inferred from a successful field-test build.

          Still required before production unless newer evidence explicitly closes the gate:
          - complete two-physical-phone BLE custody A -> B
          - physical SGA1 responder ACK return B -> A
          - production Android signing (this artifact is debug-signed)
          - production validation of end-to-end payload encryption and responder key distribution
          - real-device validation of encrypted on-device SQLite migration/reopen behavior
          - live verification of the production security/rate-limit configuration and operational uptime targets

          Use this APK with the private physical testing runbook. Do not treat local save or peer relay as responder receipt.
          EOF

      - name: Upload field-test release assets
        uses: actions/upload-artifact@v4
        with:
          name: sagip-field-test-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-field-test:
    name: Publish GitHub field-test pre-release
    needs: android-field-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download field-test release assets
        uses: actions/download-artifact@v4
        with:
          name: sagip-field-test-${{ github.ref_name }}
          path: dist

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/sagip-$GITHUB_REF_NAME.apk" \
            "dist/sagip-$GITHUB_REF_NAME.apk.sha256" \
            --prerelease \
            --title "SAGIP Field Test $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
