name: BLE Latency Branch Validation

on:
  push:
    branches:
      - 'perf/ble-relay-latency-20261003'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;27.0.12077973"
      - name: Install dependencies
        run: npm ci
      - name: Compile and test Android Survival Core
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android testDebugUnitTest compileDebugKotlin compileDebugAndroidTestKotlin --stacktrace
