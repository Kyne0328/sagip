name: Publish rc15 signed pre-release

on:
  push:
    branches:
      - release/1.0.0-rc.15
    paths:
      - .github/workflows/publish-rc15-prerelease.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact verified signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 37440542310 \
            --repo "${GITHUB_REPOSITORY}" \
            --name "sagip-production-1.0.0-rc.15" \
            --dir dist
          test -f dist/sagip-1.0.0-rc.15-release.apk
          test -f dist/sagip-1.0.0-rc.15-release.aab
          test -f dist/SHA256SUMS.txt
          test -f dist/release-notes.md
          (
            cd dist
            sha256sum -c SHA256SUMS.txt
          )

      - name: Publish signed assets as GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0-rc.15 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v1.0.0-rc.15 already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create v1.0.0-rc.15 \
            --repo "${GITHUB_REPOSITORY}" \
            --target a19241e46cb308e926f3849c6a8ce90cb3f0f289 \
            --title "SAGIP 1.0.0-rc.15" \
            --notes-file dist/release-notes.md \
            --prerelease \
            dist/sagip-1.0.0-rc.15-release.apk \
            dist/sagip-1.0.0-rc.15-release.aab \
            dist/SHA256SUMS.txt
