<rect width="100%" height="100%" fill="#ffffff"/>
<text x="1175.0" y="62.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#17202a">SAGIP DEVELOPMENT AND VALIDATION EVIDENCE</text>
<text x="1175.0" y="108.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76"><tspan x="1175.0" dy="0">Evidence labels describe what has been demonstrated. They are not maturity scores and do not collapse automated, device,</tspan><tspan x="1175.0" dy="34">backend, and field evidence into one status.</tspan></text>
<rect x="109.0" y="195.0" width="1042.0" height="320.0" rx="18" fill="#eaf2fb" stroke="#2d5f8b" stroke-width="3"/>
<text x="131.0" y="243.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#17202a"><tspan x="131.0" dy="0">1. Requirements and Architecture</tspan></text>
<rect x="131.0" y="279.0" width="300.0" height="46.0" rx="9" fill="#ffffff" stroke="#2d5f8b" stroke-width="2"/>
<text x="281.0" y="311.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2d5f8b">IMPLEMENTED</text>
<text x="131.0" y="365.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">Canonical design, delivery semantics, protocols,</text>
<text x="131.0" y="401.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">field acceptance, and responder operations are</text>
<text x="131.0" y="437.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">documented.</text>
<rect x="1199.0" y="195.0" width="1042.0" height="320.0" rx="18" fill="#eaf2fb" stroke="#2d5f8b" stroke-width="3"/>
<text x="1221.0" y="243.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#17202a"><tspan x="1221.0" dy="0">2. Core SOS and Delivery Pipeline</tspan></text>
<rect x="1221.0" y="279.0" width="300.0" height="46.0" rx="9" fill="#ffffff" stroke="#2d5f8b" stroke-width="2"/>
<text x="1371.0" y="311.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2d5f8b">AUTOMATED VERIFIED</text>
<text x="1221.0" y="365.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">Durable local creation, immutable SGP1</text>
<text x="1221.0" y="401.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">preparation, direct delivery, retry,</text>
<text x="1221.0" y="437.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">deduplication, and ACK logic have automated</text>
<rect x="109.0" y="555.0" width="1042.0" height="320.0" rx="18" fill="#eaf7ee" stroke="#2f6b45" stroke-width="3"/>
<text x="131.0" y="603.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#17202a"><tspan x="131.0" dy="0">3. Android Runtime and Lifecycle</tspan></text>
<rect x="131.0" y="639.0" width="656.0" height="46.0" rx="9" fill="#ffffff" stroke="#2f6b45" stroke-width="2"/>
<text x="459.0" y="671.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2f6b45">PHYSICAL-DEVICE VERIFIED · SELECTED PATHS</text>
<text x="131.0" y="725.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">Instrumentation and foreground-service behavior</text>
<text x="131.0" y="761.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">have physical-device evidence. This does not</text>
<text x="131.0" y="797.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">prove two-phone RF custody.</text>
<rect x="1199.0" y="555.0" width="1042.0" height="320.0" rx="18" fill="#eaf7ee" stroke="#2f6b45" stroke-width="3"/>
<text x="1221.0" y="603.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#17202a"><tspan x="1221.0" dy="0">4. Live Backend</tspan></text>
<rect x="1221.0" y="639.0" width="336.0" height="46.0" rx="9" fill="#ffffff" stroke="#2f6b45" stroke-width="2"/>
<text x="1389.0" y="671.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2f6b45">LIVE-BACKEND VERIFIED</text>
<text x="1221.0" y="725.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">Live PostgreSQL migrations/runtime and a</text>
<text x="1221.0" y="761.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">concurrent duplicate-ingestion scenario have</text>
<text x="1221.0" y="797.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">direct backend evidence.</text>
<rect x="109.0" y="915.0" width="1042.0" height="320.0" rx="18" fill="#fff5df" stroke="#9a6a18" stroke-width="3"/>
<text x="131.0" y="963.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#17202a"><tspan x="131.0" dy="0">5. BLE Store-Carry-Forward</tspan></text>
<rect x="131.0" y="999.0" width="512.0" height="46.0" rx="9" fill="#ffffff" stroke="#9a6a18" stroke-width="2"/>
<text x="387.0" y="1031.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#9a6a18">IMPLEMENTED · FIELD PATH PENDING</text>
<text x="131.0" y="1085.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">Protocol/runtime code exists, but end-to-end</text>
<text x="131.0" y="1121.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">custody across two physical phones remains</text>
<text x="131.0" y="1157.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">unverified.</text>
<rect x="1199.0" y="915.0" width="1042.0" height="320.0" rx="18" fill="#eaf2fb" stroke="#2d5f8b" stroke-width="3"/>
<text x="1221.0" y="963.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#17202a"><tspan x="1221.0" dy="0">6. Security v2 Components</tspan></text>
<rect x="1221.0" y="999.0" width="512.0" height="46.0" rx="9" fill="#ffffff" stroke="#2d5f8b" stroke-width="2"/>
<text x="1477.0" y="1031.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2d5f8b">IMPLEMENTED / AUTOMATED VERIFIED</text>
<text x="1221.0" y="1085.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">SQLCipher and SGP2/HPKE code/tests exist. SGP1</text>
<text x="1221.0" y="1121.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">remains normal emission; representative</text>
<text x="1221.0" y="1157.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">SQLCipher device migration/recovery</text>
<rect x="109.0" y="1275.0" width="1042.0" height="320.0" rx="18" fill="#fff5df" stroke="#9a6a18" stroke-width="3"/>
<text x="131.0" y="1323.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#17202a"><tspan x="131.0" dy="0">7. Complete Two-Phone Acceptance Loop</tspan></text>
<rect x="131.0" y="1359.0" width="384.0" height="46.0" rx="9" fill="#ffffff" stroke="#9a6a18" stroke-width="2"/>
<text x="323.0" y="1391.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#9a6a18">PENDING FIELD VALIDATION</text>
<text x="131.0" y="1445.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">Required: A offline → BLE custody B → B online →</text>
<text x="131.0" y="1481.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">backend → responder ACK → physical SGA1 return</text>
<text x="131.0" y="1517.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">to A.</text>
<rect x="1199.0" y="1275.0" width="1042.0" height="320.0" rx="18" fill="#fdeeee" stroke="#984242" stroke-width="3"/>
<text x="1221.0" y="1323.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#17202a"><tspan x="1221.0" dy="0">8. Production Emergency-Service</tspan><tspan x="1221.0" dy="43">Deployment</tspan></text>
<rect x="1221.0" y="1359.0" width="300.0" height="46.0" rx="9" fill="#ffffff" stroke="#984242" stroke-width="2"/>
<text x="1371.0" y="1391.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#984242">PRODUCTION-GATED</text>
<text x="1221.0" y="1445.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">Production signing, encryption/key distribution,</text>
<text x="1221.0" y="1481.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">field acceptance, and operational service gates</text>
<text x="1221.0" y="1517.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#5f6b76">must be satisfied before production claims.</text>
