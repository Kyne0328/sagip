apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

def configuredSagipBackendBaseUrl =
    (project.findProperty("SAGIP_BACKEND_BASE_URL") ?: System.getenv("SAGIP_BACKEND_BASE_URL"))
        ?.toString()
        ?.trim()

def releaseSetting = { String name ->
    (project.findProperty(name) ?: System.getenv(name))?.toString()?.trim()
}
def sagipReleaseKeystorePath = releaseSetting("SAGIP_RELEASE_KEYSTORE_PATH")
def sagipReleaseKeystorePassword = releaseSetting("SAGIP_RELEASE_KEYSTORE_PASSWORD")
def sagipReleaseKeyAlias = releaseSetting("SAGIP_RELEASE_KEY_ALIAS")
def sagipReleaseKeyPassword = releaseSetting("SAGIP_RELEASE_KEY_PASSWORD")
def configuredSagipVersionCode = releaseSetting("SAGIP_VERSION_CODE")
def configuredSagipVersionName = releaseSetting("SAGIP_VERSION_NAME")
def sagipVersionCode =
    configuredSagipVersionCode != null && configuredSagipVersionCode ==~ /[1-9][0-9]*/
        ? configuredSagipVersionCode.toInteger()
        : 1
def sagipVersionName = configuredSagipVersionName ?: "1.0"
def hasSagipReleaseSigning = [
    sagipReleaseKeystorePath,
    sagipReleaseKeystorePassword,
    sagipReleaseKeyAlias,
    sagipReleaseKeyPassword,
].every { it != null && !it.isEmpty() }

def buildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "org.sagip.app"

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "org.sagip.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode sagipVersionCode
        versionName sagipVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasSagipReleaseSigning) {
            release {
                storeFile file(sagipReleaseKeystorePath)
                storePassword sagipReleaseKeystorePassword
                keyAlias sagipReleaseKeyAlias
                keyPassword sagipReleaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            def debugBackendBaseUrl = configuredSagipBackendBaseUrl ?: "http://10.0.2.2:8080"
            buildConfigField "String", "SAGIP_BACKEND_BASE_URL", buildConfigString(debugBackendBaseUrl)
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            if (hasSagipReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            // A release build never falls back to the Android emulator host address.
            // Set SAGIP_BACKEND_BASE_URL as a Gradle property or environment variable.
            def releaseBackendBaseUrl = configuredSagipBackendBaseUrl ?: ""
            buildConfigField "String", "SAGIP_BACKEND_BASE_URL", buildConfigString(releaseBackendBaseUrl)
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }
}

tasks.register("validateSagipReleaseConfiguration") {
    doLast {
        if (!configuredSagipBackendBaseUrl) {
            throw new GradleException(
                "SAGIP_BACKEND_BASE_URL is required for release builds. " +
                "Provide an HTTPS base URL with -PSAGIP_BACKEND_BASE_URL=https://..."
            )
        }
        if (!configuredSagipBackendBaseUrl.startsWith("https://")) {
            throw new GradleException("Release SAGIP_BACKEND_BASE_URL must use HTTPS")
        }
        if (!configuredSagipVersionCode || !(configuredSagipVersionCode ==~ /[1-9][0-9]*/)) {
            throw new GradleException(
                "SAGIP_VERSION_CODE is required for release builds and must be a positive integer"
            )
        }
        if (!configuredSagipVersionName) {
            throw new GradleException("SAGIP_VERSION_NAME is required for release builds")
        }
        if (!hasSagipReleaseSigning) {
            throw new GradleException(
                "Production release signing is required. Configure " +
                "SAGIP_RELEASE_KEYSTORE_PATH, SAGIP_RELEASE_KEYSTORE_PASSWORD, " +
                "SAGIP_RELEASE_KEY_ALIAS, and SAGIP_RELEASE_KEY_PASSWORD."
            )
        }
        if (!file(sagipReleaseKeystorePath).isFile()) {
            throw new GradleException("SAGIP_RELEASE_KEYSTORE_PATH must point to an existing keystore file")
        }
    }
}

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn("validateSagipReleaseConfiguration")
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Production security primitives: reviewed HPKE implementation and maintained encrypted SQLite.
    implementation("com.google.crypto.tink:tink-android:1.23.0")
    implementation("net.zetetic:sqlcipher-android:4.17.0@aar")
    implementation("androidx.sqlite:sqlite:2.6.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
}
